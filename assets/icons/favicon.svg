<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" fill="#0a0a0a"/>
  
  <!-- Stylized building/mall structure in gold -->
  <!-- Left tower -->
  <rect x="40" y="50" width="25" height="85" fill="#d4a574" rx="2"/>
  
  <!-- Center tower (taller) -->
  <rect x="77.5" y="35" width="25" height="100" fill="#d4a574" rx="2"/>
  
  <!-- Right tower -->
  <rect x="115" y="50" width="25" height="85" fill="#d4a574" rx="2"/>
  
  <!-- Accent: horizontal bar connecting towers -->
  <rect x="40" y="45" width="100" height="3" fill="#d4a574"/>
  
  <!-- Dot accent below (represents activity/visitors) -->
  <circle cx="90" cy="150" r="6" fill="#d4a574" opacity="0.8"/>
</svg>
</svg>